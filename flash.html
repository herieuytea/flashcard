<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Flash Card Alfabet Anak</title>
  <!-- Tambahkan font indah dari Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #333;
    }
    h1 {
      color: #fff;
      margin: 15px 0;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }
    .huruf {
      font-family: 'Baloo 2', cursive; /* font indah */
      font-size: 15vh;
      font-weight: bold;
      color: #2c3e50;
      margin: 2vh 0;
      animation: bounceIn 0.8s ease;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3); /* biar lebih jelas */
    }
    .emoji {
      font-size: 45vh;
      margin: 2vh 0;
      animation: zoomIn 0.8s ease;
    }
    .kata {
      font-size: 7vh;
      margin-top: 2vh;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease;
    }
    .controls {
      margin-top: 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      margin: 10px;
      padding: 30px 60px;
      font-size: 6vh;
      border: none;
      border-radius: 15px;
      background: #f9d423;
      color: #333;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      background: #ff4e50;
      color: #fff;
      transform: scale(1.05);
    }

    /* Animasi */
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    @keyframes zoomIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @media (min-width: 768px) {
      .huruf { font-size: 120px; }
      .emoji { font-size: 360px; }
      .kata { font-size: 50px; }
      button { font-size: 32px; padding: 30px 70px; }
    }
  </style>
</head>
<body>
  <h1>Flash Card Alfabet Ceria</h1>
  <div class="huruf" id="huruf">A</div>
  <div class="emoji" id="emoji">🍎</div>
  <div class="kata" id="kata">Apel</div>

  <div class="controls">
    <button onclick="prevCard()">⬅️ Sebelumnya</button>
    <button onclick="nextCard()">➡️ Berikutnya</button>
    <button onclick="shuffleCards()">🔀 Acak</button>
    <button onclick="toggleAuto()">▶️/⏸️ Mode Otomatis</button>
  </div>

  <script>
    const cards = [
      { huruf: "A", kata: "Apel", emoji: "🍎" },
      { huruf: "B", kata: "Bola", emoji: "⚽" },
      { huruf: "C", kata: "Cicak", emoji: "🦎" },
      { huruf: "D", kata: "Dadu", emoji: "🎲" },
      { huruf: "E", kata: "Emas", emoji: "🪙" },
      { huruf: "F", kata: "Foto", emoji: "📷" },
      { huruf: "G", kata: "Gitar", emoji: "🎸" },
      { huruf: "H", kata: "Hati", emoji: "❤️" },
      { huruf: "I", kata: "Ikan", emoji: "🐟" },
      { huruf: "J", kata: "Jam", emoji: "⏰" },
      { huruf: "K", kata: "Kunci", emoji: "🔑" },
      { huruf: "L", kata: "Lilin", emoji: "🕯️" },
      { huruf: "M", kata: "Matahari", emoji: "☀️" },
      { huruf: "N", kata: "Nasi", emoji: "🍚" },
      { huruf: "O", kata: "Obat", emoji: "💊" },
      { huruf: "P", kata: "Pohon", emoji: "🌳" },
      { huruf: "Q", kata: "Quran", emoji: "📖" },
      { huruf: "R", kata: "Rumah", emoji: "🏠" },
      { huruf: "S", kata: "Sepeda", emoji: "🚲" },
      { huruf: "T", kata: "Topi", emoji: "🎩" },
      { huruf: "U", kata: "Uang", emoji: "💵" },
      { huruf: "V", kata: "Vas", emoji: "🏺" },
      { huruf: "W", kata: "Wayang", emoji: "🎭" },
      { huruf: "X", kata: "Xilofon", emoji: "🎼" },
      { huruf: "Y", kata: "Yoyo", emoji: "🪀" },
      { huruf: "Z", kata: "Zebra", emoji: "🦓" }
    ];

    let index = 0;
    let autoMode = false;
    let autoInterval;
    let autoShuffle = false;

    function showCard(i) {
      const hurufEl = document.getElementById("huruf");
      const emojiEl = document.getElementById("emoji");
      const kataEl = document.getElementById("kata");

      hurufEl.textContent = cards[i].huruf;
      emojiEl.textContent = cards[i].emoji;
      kataEl.textContent = cards[i].kata;

      // reset animasi
      hurufEl.style.animation = "none";
      emojiEl.style.animation = "none";
      kataEl.style.animation = "none";
      void hurufEl.offsetWidth;
      void emojiEl.offsetWidth;
      void kataEl.offsetWidth;

      hurufEl.style.animation = "bounceIn 0.8s ease";
      emojiEl.style.animation = "zoomIn 0.8s ease";
      kataEl.style.animation = "fadeIn 1s ease";

      speakLetter(cards[i].huruf);
    }

    function nextCard() {
      index = (index + 1) % cards.length;
      showCard(index);
    }

    function prevCard() {
      index = (index - 1 + cards.length) % cards.length;
      showCard(index);
    }

    function shuffleCards() {
      index = Math.floor(Math.random() * cards.length);
      showCard(index);
      autoShuffle = true;
    }

    function toggleAuto() {
      if (!autoMode) {
        autoMode = true;
        autoInterval = setInterval(() => {
          if (autoShuffle) {
            shuffleCards();
          } else {
            nextCard();
          }
        }, 3000);
      } else {
        autoMode = false;
        clearInterval(autoInterval);
        autoShuffle = false;
      }
    }

    function speakLetter(letter) {
      const utterance = new SpeechSynthesisUtterance(letter);
      utterance.lang = "id-ID";
      speechSynthesis.speak(utterance);
    }

    showCard(index);
  </script>
</body>
</html>
